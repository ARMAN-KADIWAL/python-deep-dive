name: Python Labs 70-74 — unittest validation

on:
  push:
    paths:
      - 'Lab 70/**'
      - 'Lab 71/**'
      - 'Lab 72/**'
      - 'Lab 73/**'
      - 'Lab 74/**'
      - '.github/workflows/labs70-74-validation.yml'
  pull_request:
    paths:
      - 'Lab 70/**'
      - 'Lab 71/**'
      - 'Lab 72/**'
      - 'Lab 73/**'
      - 'Lab 74/**'
      - '.github/workflows/labs70-74-validation.yml'

jobs:
  python-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify labs with standard-library unittest
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          for lab in 70 71 72 73 74; do
            echo "Testing Lab $lab"
            (cd "Lab $lab" && python3 -m unittest discover -v -p 'test_*.py')
          done
